name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Schema docs up to date
        run: python -m pitchlens.schema.export && git diff --exit-code docs/schema
      - name: Generate demo match (deterministic)
        run: python -m pitchlens.synth.generate --seed 6 --narrative late_comeback --out data/synthetic/demo > /dev/null
      - name: Tests (incl. LLM-grounding eval, golden images, latency budget)
        run: pytest
  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "pitchlens:ci" }
