<!doctype html>
<html><head><meta charset="utf-8"><title>Matchday Pop</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--a:#ff2d55;--b:#ff9f1c;--c:#7b2ff7;--ink:#1a0b2e}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Unbounded',sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px}
.bg,.pitch{position:absolute;inset:0}
.bg{filter:saturate(1.15) contrast(1.04)}
.grad{background:linear-gradient(120deg,var(--a),var(--b))}
.bug{position:absolute;left:56px;top:46px;display:flex;align-items:center;gap:0;border-radius:999px;padding:6px;background:#fff;box-shadow:0 10px 0 rgba(26,11,46,.35)}
.bug .t{display:flex;align-items:center;gap:10px;padding:8px 18px;font-weight:800;font-size:24px;color:var(--ink)}
.bug .crest{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}
.bug .s{padding:8px 22px;border-radius:999px;font-weight:900;font-size:28px;color:#fff}
.bug .c{padding:8px 18px 8px 10px;font-family:'Manrope';font-weight:800;font-size:20px;color:var(--c)}
.card{position:absolute;left:70px;bottom:70px;width:560px;transform:rotate(-3.5deg);border-radius:28px;padding:30px 32px 30px;background:linear-gradient(140deg,#ff2d55 0%,#ff5e3a 55%,#ff9f1c 100%);box-shadow:0 14px 0 var(--ink),0 30px 60px rgba(0,0,0,.4);overflow:hidden;border:5px solid #fff}
.card:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.5px);background-size:16px 16px;mask-image:linear-gradient(200deg,#000 0%,transparent 60%)}
.card .kick{position:relative;display:inline-block;padding:8px 16px;border-radius:999px;background:var(--ink);font-weight:700;font-size:15px;letter-spacing:.14em}
.card .row{position:relative;display:flex;align-items:flex-end;gap:20px;margin-top:14px}
.card .n{font-weight:900;font-size:210px;line-height:.8;color:#fff;text-shadow:7px 7px 0 var(--ink);letter-spacing:-.04em}
.card h2{font-weight:800;font-size:36px;padding-right:110px;line-height:1.02;text-transform:uppercase;padding-bottom:14px}
.card p{position:relative;font-family:'Manrope';font-weight:700;font-size:23px;line-height:1.35;margin-top:18px;color:#fff}
.card .stick{position:absolute;right:-18px;top:-18px;width:150px;height:150px;border-radius:50%;background:#fff;color:var(--a);display:grid;place-items:center;text-align:center;transform:rotate(12deg);box-shadow:0 8px 0 var(--ink)}
.card .stick b{display:block;font-size:40px;font-weight:900;line-height:1}
.card .stick span{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:6px 22px 6px 6px;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:24px;box-shadow:0 7px 0 rgba(26,11,46,.55);transform:translate(-50%,-100%) rotate(-3deg)}
.pill i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px}
.pill small{font-family:'Manrope';font-weight:800;font-size:17px;color:var(--a)}
.speed{position:absolute;padding:8px 16px;border-radius:14px;font-weight:900;font-size:22px;transform:rotate(6deg);box-shadow:0 6px 0 var(--ink)}
.burst{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--ink);background:#fff;border-radius:50%;box-shadow:0 5px 0 rgba(26,11,46,.6)}
.tag{position:absolute;right:60px;top:60px;text-shadow:0 2px 8px rgba(0,0,0,.6);font:700 14px 'Unbounded';letter-spacing:.24em;color:rgba(255,255,255,.85)}
</style></head>
<body><div id="stage"></div>
<script src="out/scene.js"></script><script src="common.js"></script>
<script>
{
const {S, svgEl, stage, html} = DESIGN;
const {root, svg, defs} = stage();
defs.innerHTML = `
  <linearGradient id="pop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
  <linearGradient id="popL" gradientUnits="userSpaceOnUse" x1="690" y1="280" x2="1010" y2="560"><stop offset="0" stop-color="#ff9f1c"/><stop offset=".5" stop-color="#ff2d55"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
  <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#1a0b2e" flood-opacity=".55"/></filter>
  <filter id="bl"><feGaussianBlur stdDeviation="8"/></filter>`;
// chunky gradient trail between the steals
svgEl("path", {d: S.chain, fill: "none", stroke: "#1a0b2e", "stroke-opacity": .45, "stroke-width": 16, "stroke-linecap": "round", transform: "translate(0,4)"}, svg);
svgEl("path", {d: S.chain, fill: "none", stroke: "url(#popL)", "stroke-width": 12, "stroke-linecap": "round"}, svg);
svgEl("path", {d: S.chain, fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-dasharray": "1 16", "stroke-linecap": "round"}, svg);
// star stickers on the grass
S.markers.forEach((m, i) => {
  svgEl("path", {d: m.ring3, fill: "#ff2d55", "fill-opacity": .35, filter: "url(#bl)"}, svg);
  svgEl("path", {d: m.star, fill: "url(#pop)", stroke: "#fff", "stroke-width": 4, "stroke-linejoin": "round", filter: "url(#sh)"}, svg);
  html(root, `<div class="burst" style="left:${m.u + 1.9 * m.scale}px;top:${m.v - 1.6 * m.scale}px;transform:translate(-50%,-50%) rotate(${[-10, 8, -6][i]}deg)">${m.minute}</div>`);
});
// player: double gradient ring + pill name + speed sticker
const P = S.player, R = S.ring;
svgEl("path", {d: R.r3, fill: "#ff9f1c", "fill-opacity": .22, filter: "url(#bl)"}, svg);
svgEl("path", {d: R.r2, fill: "none", stroke: "#1a0b2e", "stroke-opacity": .5, "stroke-width": 10, transform: "translate(0,3)"}, svg);
svgEl("path", {d: R.r2, fill: "none", stroke: "url(#pop)", "stroke-width": 8}, svg);
svgEl("path", {d: R.r1, fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-dasharray": "6 6"}, svg);
html(root, `<div class="pill" style="left:${P.foot[0] - 120}px;top:${P.box[1] + 4}px"><i class="grad">${P.number}</i><span>JORY!<br><small>the ball thief</small></span></div>`);
svgEl("path", {d: `M${P.foot[0] - 64},${P.box[1] - 2} Q${P.foot[0] - 20},${P.box[1] - 10} ${P.foot[0] - 8},${P.box[1] + 6}`, fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round"}, svg);
html(root, `<div class="speed grad" style="left:${P.foot[0] - 268}px;top:${P.box[1] + 20}px">⚡ ${P.speed} km/h</div>`);
// score pill
html(root, `<div class="bug"><div class="t"><span class="crest" style="background:#e0233f">KB</span>KBY</div>
  <div class="s grad">${S.stat.score.join(" : ")}</div><div class="t">IRV<span class="crest" style="background:#1fb5a8">IV</span></div><div class="c">${S.stat.minute}</div></div>`);
// sticker card
html(root, `<div class="card"><div class="stick"><div><b>#1</b><span>TONIGHT</span></div></div>
  <span class="kick">★ SUPER STEALS</span>
  <div class="row"><div class="n">${S.stat.value}</div><h2>steals near<br>their goal!</h2></div>
  <p>Jory keeps grabbing the ball close to the other team's goal. Nobody has done it more tonight!</p></div>`);
html(root, `<div class="tag">D · MATCHDAY POP</div>`);
}
</script></body></html>
