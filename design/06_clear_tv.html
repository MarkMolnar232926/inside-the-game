<!doctype html>
<html><head><meta charset="utf-8"><title>Clear TV</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Legibility rules: title-safe margins (96 x 54 px), solid opaque plates (no glass), >= 7:1 contrast,
   body text >= 34 px, one message at a time, on-pitch marks in yellow/white with dark outlines
   (no red-on-green, which colour-blind viewers cannot separate from grass). */
:root{--navy:#0a1733;--yel:#ffd60a;--ink:#fff;--sub:#d7deee}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter Tight',sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px}
.bg,.pitch{position:absolute;inset:0}
.bug{position:absolute;left:96px;top:54px;display:flex;align-items:stretch;height:72px;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);font-weight:800;font-size:38px}
.bug div{display:flex;align-items:center;padding:0 22px;background:var(--navy)}
.bug .sw{width:12px;padding:0}
.bug .sc{background:#fff;color:var(--navy);font-size:42px;padding:0 24px}
.bug .clk{background:#1d2c52;font-weight:700;font-size:34px;font-variant-numeric:tabular-nums}
.name{position:absolute;display:flex;align-items:center;height:64px;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.55);transform:translate(-100%,-50%)}
.name b{display:grid;place-items:center;width:64px;height:100%;background:var(--yel);color:var(--navy);font-size:38px;font-weight:900}
.name span{padding:0 22px;background:var(--navy);height:100%;display:flex;align-items:center;font-size:36px;font-weight:800;letter-spacing:.01em}
.badge{position:absolute;transform:translate(-50%,-100%);display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--yel);color:var(--navy);font-size:34px;font-weight:900;border:4px solid var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.lower{position:absolute;left:96px;right:96px;bottom:54px;display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.lower .n{display:grid;place-items:center;width:200px;background:var(--yel);color:var(--navy);font-size:150px;font-weight:900;line-height:1}
.lower .t{flex:1;padding:24px 36px;background:var(--navy)}
.lower .who{font-size:30px;font-weight:700;color:var(--yel)}
.lower h2{font-size:52px;font-weight:800;line-height:1.08;margin-top:4px}
.lower p{font-size:36px;font-weight:600;color:var(--sub);margin-top:8px}
.lower .key{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 36px;background:#14234a;font-size:30px;font-weight:700}
.lower .key div{display:flex;align-items:center;gap:14px}
.lower .key i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--yel);color:var(--navy);font-style:normal;font-weight:900;font-size:24px}
.tag{position:absolute;right:96px;top:62px;font:800 16px 'Inter Tight';letter-spacing:.28em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
</style></head>
<body><div id="stage"></div>
<script src="out/scene.js"></script><script src="common.js"></script>
<script>
{
const {S, svgEl, stage, html} = DESIGN;
const {root, svg, defs} = stage();
const ring = (d, w, col) => {  // every on-pitch line: dark outline under a bright core
  svgEl("path", {d, fill: "none", stroke: "#0a1733", "stroke-opacity": .85, "stroke-width": w + 5}, svg);
  svgEl("path", {d, fill: "none", stroke: col, "stroke-width": w}, svg);
};
ring(S.chain, 4, "#fff");
S.markers.forEach((m, i) => {
  svgEl("path", {d: m.ring2, fill: "#0a1733", "fill-opacity": .35, stroke: "#0a1733", "stroke-width": 9}, svg);
  svgEl("path", {d: m.ring2, fill: "none", stroke: "#ffd60a", "stroke-width": 6}, svg);
  svgEl("path", {d: m.disc, fill: "#ffd60a", stroke: "#0a1733", "stroke-width": 3}, svg);
  const h = 2.2 * m.scale;
  svgEl("line", {x1: m.u, y1: m.v, x2: m.u, y2: m.v - h, stroke: "#0a1733", "stroke-width": 7}, svg);
  svgEl("line", {x1: m.u, y1: m.v, x2: m.u, y2: m.v - h, stroke: "#ffd60a", "stroke-width": 3}, svg);
  html(root, `<div class="badge" style="left:${m.u}px;top:${m.v - h + 4}px">${i + 1}</div>`);
});
const P = S.player;
ring(S.ring.r2, 6, "#fff");
const nx = P.foot[0] - 24, ny = P.box[1] - 62;  // above-left: clear of the badges and the evidence path
svgEl("line", {x1: nx, y1: ny, x2: P.foot[0], y2: P.box[1] - 4, stroke: "#0a1733", "stroke-width": 7}, svg);
svgEl("line", {x1: nx, y1: ny, x2: P.foot[0], y2: P.box[1] - 4, stroke: "#fff", "stroke-width": 3}, svg);
html(root, `<div class="name" style="left:${nx}px;top:${ny}px"><b>${P.number}</b><span>KESTANE</span></div>`);
html(root, `<div class="bug"><div class="sw" style="background:#e0233f"></div><div>KBY</div><div class="sc">${S.stat.score.join(" – ")}</div><div>IRV</div><div class="sw" style="background:#f2f2f2"></div><div class="clk">62'</div></div>`);
html(root, `<div class="lower"><div class="n">${S.stat.value}</div>
  <div class="t"><div class="who">Jory Kestane · Kestrel Bay</div><h2>Balls won near the opponent's goal</h2><p>More than any other player tonight</p></div>
  <div class="key">${S.markers.map((m, i) => `<div><i>${i + 1}</i>${m.minute}</div>`).join("")}</div></div>`);
html(root, `<div class="tag">F · CLEAR TV</div>`);
}
</script></body></html>
