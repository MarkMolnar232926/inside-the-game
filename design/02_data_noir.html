<!doctype html>
<html><head><meta charset="utf-8"><title>Data Noir</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--lime:#c8ff3d;--ink:#f4f6f0;--mute:#8a9188;--line:rgba(200,255,61,.22);--bg:rgba(6,8,7,.86);--irv:#7fd6ff}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'JetBrains Mono',monospace;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px}
.bg,.pitch,.heat{position:absolute;inset:0}
.bg{filter:saturate(.55) brightness(.78) contrast(1.05)}
.heat{mix-blend-mode:screen;opacity:.85}
.panel{position:absolute;top:0;right:0;bottom:0;width:520px;background:var(--bg);backdrop-filter:blur(18px) saturate(.6);border-left:1px solid var(--line);padding:40px 40px 36px;display:flex;flex-direction:column;gap:26px}
.k{font-size:13px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand b{font-weight:700;font-size:15px;letter-spacing:.24em;color:var(--lime)}
.live{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.2em}
.live i{width:8px;height:8px;background:var(--lime);border-radius:50%;box-shadow:0 0 12px var(--lime)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 22px;align-items:end;border-top:1px solid var(--line);padding-top:24px}
.hero .v{font-family:'Inter Tight';font-weight:800;font-size:132px;line-height:.78;color:var(--lime);letter-spacing:-.04em}
.hero h2{font-family:'Inter Tight';font-weight:600;font-size:27px;line-height:1.12}
.hero .k{grid-column:1/-1;margin-top:14px;letter-spacing:.1em}
.why{font-size:15.5px;line-height:1.6;color:#d3d8cf}
.why em{font-style:normal;color:var(--lime)}
.row{display:grid;grid-template-columns:70px 1fr 56px;align-items:center;gap:12px;font-size:14px;margin-top:10px}
.bar{height:8px;background:rgba(255,255,255,.08);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--lime)}
.bar.o span{background:var(--irv)}
.tl{position:relative;height:56px;margin-top:14px}
.tl .axis{position:absolute;left:0;right:0;top:26px;height:1px;background:rgba(255,255,255,.25)}
.tl .ht{position:absolute;top:18px;width:1px;height:17px;background:rgba(255,255,255,.4)}
.tl .ev{position:absolute;top:16px;width:10px;height:21px;transform:translateX(-50%);background:var(--lime)}
.tl .now{position:absolute;top:6px;bottom:0;width:2px;background:#fff}
.tl .lab{position:absolute;top:40px;font-size:12px;color:var(--mute);transform:translateX(-50%)}
.tl .evl{position:absolute;top:-2px;font-size:12px;color:var(--lime);transform:translateX(-50%)}
.mini{border:1px solid var(--line);padding:6px;background:rgba(0,0,0,.25)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;color:var(--mute);letter-spacing:.12em}
.call{position:absolute;font-size:13px;line-height:1.45;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--lime);white-space:nowrap}
.call b{color:var(--lime);font-weight:700}
.call .m{color:var(--mute)}
.tagp{position:absolute;font-size:13px;line-height:1.4;padding:7px 11px;background:var(--lime);color:#0a0d08;font-weight:700;white-space:nowrap}
.tagp span{font-weight:500}
.bug{position:absolute;left:56px;top:48px;display:flex;gap:0;font-size:20px;background:var(--bg);border:1px solid var(--line)}
.bug div{padding:12px 18px;border-right:1px solid var(--line)}
.bug .sc{color:var(--lime);font-weight:700}
.tag{position:absolute;left:56px;bottom:40px;font-size:13px;letter-spacing:.3em;color:rgba(255,255,255,.7)}
</style></head>
<body><div id="stage"></div>
<script src="out/scene.js"></script><script src="common.js"></script>
<script>
{
const {S, svgEl, stage, html, minimapSVG} = DESIGN;
const {root, svg, defs} = stage();
const heat = document.createElement("img"); heat.src = "out/heat.png"; heat.className = "heat"; root.insertBefore(heat, svg);
defs.innerHTML = `<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
// traced pitch model (shows the registration)
for (const d of S.lines) svgEl("path", {d, fill: "none", stroke: "#c8ff3d", "stroke-opacity": .5, "stroke-width": 1.3}, svg);
svgEl("path", {d: S.zone_edge, fill: "none", stroke: "#c8ff3d", "stroke-width": 1.5, "stroke-dasharray": "8 6"}, svg);
// chain
svgEl("path", {d: S.chain, fill: "none", stroke: "#fff", "stroke-opacity": .7, "stroke-width": 1.4, "stroke-dasharray": "1 6", "stroke-linecap": "round"}, svg);
// evidence: crosshair rings + leader + callouts
const offs = [[-150, -70], [70, -130], [-190, 70]];
S.markers.forEach((m, i) => {
  svgEl("path", {d: m.ring2, fill: "none", stroke: "#c8ff3d", "stroke-width": 1.4}, svg);
  svgEl("path", {d: m.ring1, fill: "rgba(200,255,61,.18)", stroke: "#c8ff3d", "stroke-width": 2.2, filter: "url(#g)"}, svg);
  svgEl("path", {d: m.disc, fill: "#c8ff3d"}, svg);
  const [dx, dy] = offs[i], ex = m.u + dx, ey = m.v + dy, kx = m.u + dx * .35;
  svgEl("path", {d: `M${m.u},${m.v} L${kx},${ey} L${ex},${ey}`, fill: "none", stroke: "#c8ff3d", "stroke-width": 1.2}, svg);
  svgEl("circle", {cx: ex, cy: ey, r: 3, fill: "#c8ff3d"}, svg);
  const dg = Math.hypot(105 - m.x, 34 - m.y).toFixed(1);
  const left = dx < 0;
  html(root, `<div class="call" style="left:${ex}px;top:${ey}px;transform:translate(${left ? "calc(-100% - 8px)" : "8px"},-50%)">
    <b>INT·0${i + 1}</b> ${m.minute} <span class="m">#7</span><br><span class="m">x</span> ${m.x.toFixed(1)} <span class="m">y</span> ${m.y.toFixed(1)} <span class="m">·</span> ${dg} m<span class="m"> to goal</span></div>`);
});
// player: corner brackets around the detection box + data tag
const P = S.player, [x0, y0, x1, y1] = P.box, pad = 8, c = 10;
const X0 = x0 - pad, Y0 = y0 - pad, X1 = x1 + pad, Y1 = y1 + pad;
svgEl("path", {d: `M${X0},${Y0 + c} V${Y0} H${X0 + c} M${X1 - c},${Y0} H${X1} V${Y0 + c} M${X1},${Y1 - c} V${Y1} H${X1 - c} M${X0 + c},${Y1} H${X0} V${Y1 - c}`,
  fill: "none", stroke: "#fff", "stroke-width": 2}, svg);
svgEl("path", {d: S.ring.r1, fill: "none", stroke: "#fff", "stroke-width": 1.4}, svg);
if (S.ring.trail) svgEl("path", {d: S.ring.trail, fill: "none", stroke: "#fff", "stroke-opacity": .8, "stroke-width": 2, "stroke-dasharray": "4 4"}, svg);
svgEl("line", {x1: X1, y1: Y0, x2: X1 + 26, y2: Y0 - 26, stroke: "#fff", "stroke-width": 1.2}, svg);
html(root, `<div class="tagp" style="left:${X1 + 26}px;top:${Y0 - 26}px;transform:translateY(-100%)">KBY·07 KESTANE<br><span>v ${P.speed} km/h · d ${P.distance_km} km</span></div>`);
// bug
html(root, `<div class="bug"><div>KBY</div><div class="sc">${S.stat.score.join(" : ")}</div><div>IRV</div><div style="color:#8a9188">${S.stat.clock}</div></div>`);
// panel
const pct = (m) => (parseInt(m) / 90) * 100;
const mm = minimapSVG(438, 284, {line: "rgba(200,255,61,.45)", zone: "rgba(200,255,61,.08)", home: "#c8ff3d", away: "#7fd6ff", heroStroke: "#fff",
  frustum: "rgba(255,255,255,.06)", frustumStroke: "rgba(255,255,255,.35)",
  markers: (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#c8ff3d" stroke-width="1.5"/>`});
html(root, `<div class="panel">
  <div class="brand"><b>PITCHLENS / ANALYST</b><span class="live"><i></i>LIVE ${S.stat.clock}</span></div>
  <div class="hero"><div class="v">${S.stat.value}</div><h2>final-third interceptions<br><span style="color:#8a9188">J. Kestane · KBY #7</span></h2>
    <div class="k">${S.stat.share}% of team · ${S.stat.dist} m avg to goal · #${S.stat.rank} in match</div></div>
  <div class="why">${S.stat.why_analyst.replace("press", "<em>press</em>")}</div>
  <div><div class="k">evidence timeline</div>
    <div class="tl"><div class="axis"></div><div class="ht" style="left:50%"></div>
      ${S.markers.map((m, i) => `<div class="ev" style="left:${pct(m.minute)}%"></div>`).join("")}
      <div class="evl" style="left:${pct("34")}%">34'</div><div class="evl" style="left:${pct("61")}%">60'·62'</div>
      <div class="now" style="left:${(62.2 / 90) * 100}%"></div>
      <div class="lab" style="left:2%">0'</div><div class="lab" style="left:50%">HT</div><div class="lab" style="left:97%">90'</div></div></div>
  <div><div class="k">pressing intensity · PPDA (lower = harder)</div>
    <div class="row"><span>KBY</span><div class="bar"><span style="width:${(1 - S.stat.ppda / 14) * 100}%"></span></div><span>${S.stat.ppda}</span></div>
    <div class="row"><span>IRV</span><div class="bar o"><span style="width:${(1 - S.stat.ppda_opp / 14) * 100}%"></span></div><span>${S.stat.ppda_opp}</span></div>
    <div class="row"><span>xG</span><div class="bar"><span style="width:${S.stat.xg[0] / 1.5 * 100}%"></span></div><span>${S.stat.xg[0].toFixed(2)}</span></div>
    <div class="row"><span></span><div class="bar o"><span style="width:${S.stat.xg[1] / 1.5 * 100}%"></span></div><span>${S.stat.xg[1].toFixed(2)}</span></div></div>
  <div class="mini">${mm}</div>
  <div class="foot"><span>SRC events 1–3 · verified</span><span>heat: KBY ball wins</span></div>
</div>`);
html(root, `<div class="tag">B · DATA NOIR</div>`);
}
</script></body></html>
