<!doctype html>
<html><head><meta charset="utf-8"><title>Studio Glass</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#0e1726;--mute:#5b6576;--accent:#d61f45;--glass:rgba(250,251,253,.74);--edge:rgba(255,255,255,.75)}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Manrope',sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px}
.bg,.pitch{position:absolute;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--edge);box-shadow:0 20px 50px rgba(5,10,20,.28),inset 0 1px 0 #fff}
.bug{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:10px 12px 10px 24px;border-radius:18px;font-weight:800;font-size:22px;letter-spacing:.02em}
.bug .sc{font-family:'Inter Tight';font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.bug .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.bug .clk{padding:8px 14px;border-radius:11px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.lower{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);width:1180px;display:grid;grid-template-columns:auto 1fr 300px;gap:0;border-radius:26px;overflow:hidden}
.lower .num{display:flex;align-items:center;gap:18px;padding:26px 34px;border-right:1px solid rgba(14,23,38,.08)}
.lower .num b{font-family:'Inter Tight';font-weight:800;font-size:112px;line-height:.85;letter-spacing:-.05em;color:var(--accent)}
.lower .num div{font-size:15px;font-weight:700;color:var(--mute);line-height:1.35;letter-spacing:.06em;text-transform:uppercase}
.lower .txt{padding:26px 34px}
.lower .kick{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.lower .kick .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:0}
.lower h2{font-family:'Inter Tight';font-size:32px;font-weight:700;letter-spacing:-.01em;margin-top:8px;line-height:1.1}
.lower p{font-size:18px;font-weight:500;line-height:1.45;color:#2b3445;margin-top:8px}
.lower .side{padding:26px 28px;background:rgba(14,23,38,.04);border-left:1px solid rgba(14,23,38,.08);display:flex;flex-direction:column;gap:12px;justify-content:center}
.lower .side .r{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;color:var(--mute)}
.lower .side .r b{font-family:'Inter Tight';font-size:24px;color:var(--ink)}
.tl{position:relative;height:6px;border-radius:3px;background:rgba(14,23,38,.12);margin:6px 0 16px}
.tl i{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translateX(-50%)}
.tl .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,rgba(214,31,69,.15),rgba(214,31,69,.55))}
.tl span{position:absolute;top:16px;font-size:11px;font-weight:700;color:var(--mute);transform:translateX(-50%)}
.map{position:absolute;right:52px;top:40px;width:400px;padding:16px 16px 14px;border-radius:22px}
.map .h{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--mute);margin:2px 4px 10px;text-transform:uppercase}
.map .h b{color:var(--ink)}
.map svg{display:block;border-radius:12px;background:linear-gradient(180deg,#2f8f55,#277a49)}
.chip{position:absolute;transform:translate(-50%,-100%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:'Inter Tight';font-weight:800;font-size:16px;color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.name{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;font-weight:800;font-size:17px;white-space:nowrap}
.name .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.name small{font-weight:700;font-size:14px;color:var(--mute);margin-left:4px}
.tag{position:absolute;left:52px;top:52px;font:800 13px 'Manrope';letter-spacing:.3em;color:rgba(255,255,255,.9);text-shadow:0 1px 8px rgba(0,0,0,.5)}
</style></head>
<body><div id="stage"></div>
<script src="out/scene.js"></script><script src="common.js"></script>
<script>
{
const {S, svgEl, stage, html, minimapSVG} = DESIGN;
const {root, svg, defs} = stage();
defs.innerHTML = `<filter id="ds" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="bl"><feGaussianBlur stdDeviation="7"/></filter>`;
// refined ground marks: soft white pools, hairline rings, numbered chips on short stems
svgEl("path", {d: S.chain, fill: "none", stroke: "#fff", "stroke-opacity": .85, "stroke-width": 2, filter: "url(#ds)"}, svg);
S.markers.forEach((m, i) => {
  svgEl("path", {d: m.ring3, fill: "#fff", "fill-opacity": .16, filter: "url(#bl)"}, svg);
  svgEl("path", {d: m.ring2, fill: "none", stroke: "#fff", "stroke-width": 1.4, "stroke-opacity": .9, filter: "url(#ds)"}, svg);
  svgEl("path", {d: m.ring1, fill: "#d61f45", "fill-opacity": .85, stroke: "#fff", "stroke-width": 2, filter: "url(#ds)"}, svg);
  const h = 1.9 * m.scale;
  svgEl("line", {x1: m.u, y1: m.v, x2: m.u, y2: m.v - h, stroke: "#fff", "stroke-width": 1.5, filter: "url(#ds)"}, svg);
  html(root, `<div class="chip glass ${i === 2 ? "on" : ""}" style="left:${m.u}px;top:${m.v - h}px">${i + 1}</div>`);
});
const P = S.player, R = S.ring;
svgEl("path", {d: R.spot, fill: "#fff", "fill-opacity": .12, filter: "url(#bl)"}, svg);
svgEl("path", {d: R.r2, fill: "none", stroke: "#fff", "stroke-width": 2.5, filter: "url(#ds)"}, svg);
svgEl("path", {d: R.arc, fill: "none", stroke: "#d61f45", "stroke-width": 3.5, "stroke-linecap": "round"}, svg);
svgEl("line", {x1: P.foot[0], y1: P.box[1] - 6, x2: P.foot[0] + 40, y2: P.box[1] - 46, stroke: "#fff", "stroke-width": 1.5, filter: "url(#ds)"}, svg);
html(root, `<div class="name glass" style="left:${P.foot[0] + 40}px;top:${P.box[1] - 46}px;transform:translate(0,-50%)"><span class="av">${P.number}</span>Jory Kestane<small>${P.speed} km/h</small></div>`);
// top centre score
html(root, `<div class="bug glass"><span><span class="dot" style="background:#e0233f"></span>Kestrel Bay</span><span class="sc">${S.stat.score.join(" – ")}</span><span>Ironvale<span class="dot" style="background:#14b8a6;margin:0 0 0 8px"></span></span><span class="clk">${S.stat.clock}</span></div>`);
// floating tactical map
const mm = minimapSVG(368, 238, {line: "rgba(255,255,255,.7)", zone: "rgba(214,31,69,.22)", home: "#e0233f", away: "#ffffff", heroStroke: "#fff",
  frustum: "rgba(255,255,255,.12)", frustumStroke: "rgba(255,255,255,.6)",
  markers: (x, y, m) => `<circle cx="${x}" cy="${y}" r="9" fill="#fff"/><text x="${x}" y="${y + 4}" font-family="Inter Tight" font-weight="800" font-size="11" text-anchor="middle" fill="#0e1726">${S.markers.indexOf(m) + 1}</text>`});
html(root, `<div class="map glass"><div class="h"><span>Where it happened</span><b>Final third</b></div>${mm}</div>`);
// lower third
const pct = (m) => (parseInt(m) / 90) * 100;
html(root, `<div class="lower glass">
  <div class="num"><b>${S.stat.value}</b><div>Final-third<br>interceptions</div></div>
  <div class="txt"><div class="kick"><span class="av">${P.number}</span>Jory Kestane · Kestrel Bay</div>
    <h2>The press is winning it high</h2><p>${S.stat.why}</p></div>
  <div class="side"><div class="r">When<span style="font-size:12px">${S.markers.map((m) => m.minute).join(" · ")}</span></div>
    <div class="tl"><div class="fill" style="width:${(62.2 / 90) * 100}%"></div>${S.markers.map((m) => `<i style="left:${pct(m.minute)}%"></i>`).join("")}<span style="left:0%">0'</span><span style="left:50%">HT</span><span style="left:100%">90'</span></div>
    <div class="r">Share of team<b>${S.stat.share}%</b></div><div class="r">Avg. from goal<b>${S.stat.dist} m</b></div></div>
</div>`);
html(root, `<div class="tag">E · STUDIO GLASS</div>`);
}
</script></body></html>
