repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=3000]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: no-test-assets
        name: forbid committing local copyrighted test assets
        entry: bash -c 'git diff --cached --name-only | grep -E "^data/test_assets/.+\.(mp4|png|jpg|webp)$" && exit 1 || exit 0'
        language: system
        pass_filenames: false
